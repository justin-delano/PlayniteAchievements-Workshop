name: Build index

# Regenerates index/ and the per-type and per-game README tables from every manifest, with
# download counts read from the releases. Runs on merges and once a day for the counts.

on:
  push:
    branches: [main]
    paths:
      - 'colors/**'
      - 'notifications/**'
      - 'frames/**'
      - 'showcase-pages/**'
      - 'sounds/**'
      - 'bundles/**'
      - 'game-data/**'
      - 'tools/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    # The bot's own index commits must not rebuild again; its dispatch after an intake merge must.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch release metadata
        run: gh api "repos/${{ github.repository }}/releases" --paginate > releases.json

      - name: Build and commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Merges can land seconds apart (one per submission), so the push races the next
          # merge. Regenerate from the current tip and push, and when main moved underneath,
          # start over from the new tip instead of failing the run.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            dotnet run --project tools/Validator -c Release -- build-index \
              --root . --releases releases.json --repo "${{ github.repository }}" --commit "$(git rev-parse HEAD)"
            # Only the index and the generated listings; a pathspec that matches nothing (no game
            # folders yet) must not fail the step, so stage by listing instead of by glob.
            git add index
            git ls-files -mo --exclude-standard -- colors notifications frames showcase-pages sounds bundles game-data \
              | grep '/README.md$' | xargs -r git add --
            if git diff --cached --quiet; then
              echo "Index unchanged."
              exit 0
            fi
            git commit -q -m "chore(index): regenerate index and listings [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during attempt $attempt; regenerating from the new tip."
          done
          echo "Could not push the regenerated index after 5 attempts." >&2
          exit 1

      # Each storage release shows the item's cover, preview, description and folder link, so
      # the release page reads like the item page. Images stay links rather than release assets,
      # because download counts are summed over assets. Only releases whose notes differ are
      # edited.
      - name: Refresh release notes
        run: |
          node .github/scripts/release-notes.mjs index/v1.json | while IFS= read -r line; do
            tag=$(node -e 'console.log(JSON.parse(process.argv[1]).tag)' "$line")
            node -e 'process.stdout.write(JSON.parse(process.argv[1]).body)' "$line" > notes.md
            current=$(gh release view "$tag" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null) || { echo "No release for $tag"; continue; }
            if [ "$current" = "$(cat notes.md)" ]; then
              continue
            fi
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file notes.md > /dev/null && echo "Updated notes for $tag"
          done
