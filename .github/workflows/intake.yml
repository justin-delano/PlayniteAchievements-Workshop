name: Intake submission

# Turns a submission issue into a commit on main: fetches the package, validates it, uploads it
# as the item's release asset, and commits the item folder. Validation here is the review.
# A submission is an issue carrying the "submission" label or a "[Submission]" title; the Worker
# opens issues with a token that cannot always set labels, so the title is the fallback and this
# workflow applies the label itself. Maintainers can re-run intake for any issue by dispatching
# the workflow with its number.

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re)process
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: intake-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'submission') ||
      startsWith(github.event.issue.title, '[Submission]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      # The account whose token the Worker uses to open issues for Playnite users; those issues
      # identify the real submitter by hash, not by this login.
      WORKSHOP_BOT_LOGIN: ${{ vars.WORKSHOP_BOT_LOGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The "labeled" event fires once per label, so an issue that already carries the label
      # when another is added would run twice; the concurrency group above cancels the older run.
      - name: Fetch the issue
        id: issue
        run: |
          mkdir -p work
          gh api "repos/$REPO/issues/$ISSUE" > work/issue.json
          echo "login=$(jq -r .user.login work/issue.json)" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state work/issue.json)" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE" --repo "$REPO" --add-label submission || true

      - name: Stop on a closed issue
        if: steps.issue.outputs.state != 'open'
        run: 'echo "Issue #$ISSUE is closed; nothing to do."'

      - name: Validate the package
        if: steps.issue.outputs.state == 'open'
        id: intake
        run: |
          dotnet run --project tools/Validator -c Release -- intake \
            --issue work/issue.json --work work --repo "$REPO" --root . \
            --actor "${{ steps.issue.outputs.login }}"
          echo "ok=$(jq -r .ok work/result.json)" >> "$GITHUB_OUTPUT"
          echo "remove=$(jq -r .remove work/result.json)" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .id work/result.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag work/result.json)" >> "$GITHUB_OUTPUT"
          echo "asset=$(jq -r .assetName work/result.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name work/result.json)" >> "$GITHUB_OUTPUT"

      - name: Report validation errors
        if: steps.issue.outputs.state == 'open' && steps.intake.outputs.ok != 'true'
        run: |
          {
            echo "The submission could not be accepted:"
            echo
            jq -r '.errors[] | "- " + .' work/result.json
            echo
            echo "Edit this issue to fix the fields or attach a corrected package; the check runs again automatically."
          } > work/comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file work/comment.md
          gh issue edit "$ISSUE" --repo "$REPO" --add-label needs-changes --remove-label in-review || true
          exit 0

      - name: Upload the package to the item's release
        if: steps.issue.outputs.state == 'open' && steps.intake.outputs.ok == 'true' && steps.intake.outputs.remove != 'true'
        run: |
          TAG="${{ steps.intake.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "${{ steps.intake.outputs.name }}" \
              --notes "Workshop storage for \`${{ steps.intake.outputs.id }}\`. See the item folder for details." \
              --latest=false --prerelease
          fi
          gh release upload "$TAG" "work/package/${{ steps.intake.outputs.asset }}" --repo "$REPO" --clobber
          ASSET_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.name == "${{ steps.intake.outputs.asset }}") | .url')
          dotnet run --project tools/Validator -c Release -- finalize \
            --item "work/item/${{ steps.intake.outputs.id }}" --asset-url "$ASSET_URL"

      - name: Commit the item to main
        if: steps.issue.outputs.state == 'open' && steps.intake.outputs.ok == 'true'
        run: |
          ID="${{ steps.intake.outputs.id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.intake.outputs.remove }}" = "true" ]; then
            TITLE="Remove ${{ steps.intake.outputs.name }} ($ID)"
          else
            TITLE="${{ steps.intake.outputs.name }} ($ID)"
          fi
          # Validation is the review, so the item goes straight to main; reverting the commit
          # takes it down. Another submission may land meanwhile: rebuild the commit on the new
          # main and push again.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B intake-commit origin/main
            if [ "${{ steps.intake.outputs.remove }}" = "true" ]; then
              git rm -r --quiet --ignore-unmatch "$ID"
            else
              rm -rf "$ID"
              mkdir -p "$(dirname "$ID")"
              cp -r "work/item/$ID" "$ID"
              git add "$ID"
            fi
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -q -m "$TITLE" -m "Submitted in #$ISSUE"
            if git push -q origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$pushed" != "true" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "The package passed validation but could not be committed automatically; a maintainer will finish it."
            gh issue edit "$ISSUE" --repo "$REPO" --add-label in-review --remove-label needs-changes || true
            exit 1
          fi
          COMMIT_URL="https://github.com/$REPO/commit/$(git rev-parse HEAD)"
          # A push made with the workflow token does not trigger the push workflow, so dispatch it here.
          gh workflow run build-index.yml --repo "$REPO" --ref main || true
          if [ "${{ steps.intake.outputs.remove }}" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "Done: the item was removed ($COMMIT_URL). It disappears from the Workshop once the index rebuilds, usually within a couple of minutes."
          else
            gh issue comment "$ISSUE" --repo "$REPO" --body "Done: the package passed validation and was committed ($COMMIT_URL). It appears in the Workshop once the index rebuilds, usually within a couple of minutes."
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label in-review --remove-label needs-changes || true
          gh issue close "$ISSUE" --repo "$REPO" --reason completed || true
