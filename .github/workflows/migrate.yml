name: Migrate manifests

# Run by hand after a manifest schema bump: rewrites every manifest to the current schema and
# opens one pull request with the result.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Migrate
        run: dotnet run --project tools/Validator -c Release -- migrate --root .

      - name: Open pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/migrate-manifests-$(date -u +%Y%m%d%H%M)"
          git checkout -b "$BRANCH"
          git add -A -- colors notifications frames showcase-pages sounds bundles game-data
          if git diff --cached --quiet; then
            echo "Every manifest is already at the current schema."
            exit 0
          fi
          git commit -q -m "chore(schema): migrate manifests to the current schema"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Migrate manifests to the current schema" \
            --body "Generated by the migrate workflow. See schema/CHANGELOG.md for what changed."
