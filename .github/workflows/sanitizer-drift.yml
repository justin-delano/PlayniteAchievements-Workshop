name: Sanitizer drift

# The validator carries a copy of the extension's XamlTemplateSanitizer.cs so the same allowlist
# runs here and inside the extension. This fails when the two files differ.

on:
  schedule:
    - cron: '41 4 * * *'
  pull_request:
    paths:
      - 'tools/Validator/XamlTemplateSanitizer.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the extension's dev branch
        run: |
          status=$(curl -sSL -o upstream.cs -w '%{http_code}' \
            https://raw.githubusercontent.com/justin-delano/PlayniteAchievements/dev/source/Services/UI/XamlTemplateSanitizer.cs)
          if [ "$status" = "404" ]; then
            echo "::notice::The extension's dev branch has no XamlTemplateSanitizer.cs yet; nothing to compare."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "Fetching the extension's copy failed with HTTP $status."
            exit 1
          fi
          # Line endings differ between the repositories; compare content only.
          if ! diff <(tr -d '\r' < upstream.cs) <(tr -d '\r' < tools/Validator/XamlTemplateSanitizer.cs) > drift.txt; then
            echo "tools/Validator/XamlTemplateSanitizer.cs differs from the extension's copy:"
            cat drift.txt
            exit 1
          fi
          echo "In sync."
