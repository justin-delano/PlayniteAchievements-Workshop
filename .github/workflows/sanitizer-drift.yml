name: Extension drift

# The validator carries copies of two extension files so the same rules run here and inside the
# extension: XamlTemplateSanitizer.cs (the shared-template allowlist) and package-fields.json (the
# JSON fields official packages may carry, generated by the extension's WorkshopPackageFieldsTests).
# This fails when either copy differs from the extension's dev branch.

on:
  schedule:
    - cron: '41 4 * * *'
  pull_request:
    paths:
      - 'tools/Validator/XamlTemplateSanitizer.cs'
      - 'tools/Validator/package-fields.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - local: tools/Validator/XamlTemplateSanitizer.cs
            upstream: source/Services/UI/XamlTemplateSanitizer.cs
          - local: tools/Validator/package-fields.json
            upstream: tests/PlayniteAchievements.Tests/Services/WorkshopPackageFields.json
    steps:
      - uses: actions/checkout@v4

      - name: Compare ${{ matrix.local }} with the extension's dev branch
        env:
          LOCAL: ${{ matrix.local }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          status=$(curl -sSL -o upstream.txt -w '%{http_code}' \
            "https://raw.githubusercontent.com/justin-delano/PlayniteAchievements/dev/$UPSTREAM")
          if [ "$status" = "404" ]; then
            echo "::notice::The extension's dev branch has no $UPSTREAM yet; nothing to compare."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "Fetching the extension's copy failed with HTTP $status."
            exit 1
          fi
          # Line endings differ between the repositories; compare content only.
          if ! diff <(tr -d '\r' < upstream.txt) <(tr -d '\r' < "$LOCAL") > drift.txt; then
            echo "$LOCAL differs from the extension's $UPSTREAM:"
            cat drift.txt
            exit 1
          fi
          echo "In sync."
