name = "pa-workshop"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Non-secret configuration. Secrets are set with `wrangler secret put`:
#   GITHUB_TOKEN          fine-grained PAT for the Workshop repository, Issues: read and write
#   R2_ACCESS_KEY_ID      R2 API token with object read/write on the bucket below
#   R2_SECRET_ACCESS_KEY
[vars]
GITHUB_REPO = "justin-delano/PlayniteAchievements-Workshop"
R2_ACCOUNT_ID = "a2d426f66f674c044f729ed48220bd34"
R2_BUCKET = "pa-workshop-uploads"
# Per-IP daily caps, each counted in its own bucket; 0 disables a cap. A share sends one upload
# request per file (package, preview, cover) and one submission request, so the upload cap needs
# room for several files per share.
DAILY_SUBMISSIONS_PER_IP = "100"
DAILY_UPLOADS_PER_IP = "500"
# Like and unlike presses per client (by IP) per day; 0 means no limit.
DAILY_LIKES_PER_IP = "0"
# Installs recorded per client (by IP) per day.
DAILY_INSTALLS_PER_IP = "500"
# The index a like or an install is checked against, so an unknown item id cannot seed a row.
STATS_INDEX_URL = "https://raw.githubusercontent.com/justin-delano/PlayniteAchievements-Workshop/main/index/v1.json"
# Largest package accepted, in bytes (1 GiB; GitHub's release asset cap is 2 GiB).
MAX_PACKAGE_BYTES = "1073741824"
# Bytes the bucket may hold in total before new uploads are refused. R2's free tier is 10 GB-month;
# 8 GiB leaves headroom for in-flight multipart parts. The Worker checks this before every upload.
STORAGE_CAP_BYTES = "8589934592"
PART_SIZE_BYTES = "33554432"

# Temporary storage for uploads; objects are read once by the intake workflow. Give the bucket
# lifecycle rules that delete objects after 1 day and abort stale multipart uploads (which also
# count toward storage) after 1 day:
#   wrangler r2 bucket lifecycle add pa-workshop-uploads --expire-days 1 --name expire-uploads
#   wrangler r2 bucket lifecycle add pa-workshop-uploads --abort-multipart-days 1 --name abort-stale-parts
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "pa-workshop-uploads"

# Per-IP daily counters for the submission cap.
#   wrangler kv namespace create RATE   (then paste the id below)
[[kv_namespaces]]
binding = "RATE"
id = "d152e56d2b9f4d08b073446127da6a99"

# Likes and install counts. Create it and apply schema.sql before deploying:
#   wrangler d1 create pa-workshop-stats   (then paste the id below)
#   wrangler d1 execute pa-workshop-stats --remote --file schema.sql
[[d1_databases]]
binding = "STATS"
database_name = "pa-workshop-stats"
database_id = "23f243d7-5de6-4910-bc12-1cac0e03dd6e"
